[package]
name = "scytale"
description = "Correct, fast, portable no_std cryptography: AES, ChaCha20, SHA-2, SHA-3, HMAC, CMAC, KMAC, Poly1305, HKDF, PBKDF2, TLS 1.2 PRF, X25519, ECDH, HPKE, RSA, ECDSA, Ed25519, ML-KEM, ML-DSA, SLH-DSA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/6d7770/scytale"
documentation = "https://docs.rs/scytale"
# The README lives at the workspace root; cargo only looks in the
# package directory on its own.
readme = "../README.md"
keywords = ["encryption", "hash", "mac", "signature", "post-quantum"]
categories = [
    "cryptography",
    "no-std",
    "no-std::no-alloc",
    "algorithms",
]
# ACVP vectors are vendored for development but not shipped, to keep
# the crate small; without them the ACVP suites skip and the built-in
# vectors in the unit tests remain.
exclude = ["tests/vectors"]

[dependencies]
zeroize = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Only the benchmark uses this, for CPU time rather than wall clock:
# clock_gettime(CLOCK_THREAD_CPUTIME_ID) where there is one, and
# GetThreadTimes on Windows. A dev-dependency, so nothing that depends
# on this crate ever builds it. Wasm has neither, and does not build
# the benchmark.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
cpu-time = "1"

# Only where there is something to ask. A bare metal target has
# nobody, and takes the processor's own generator instead; the same
# condition selects `System`'s body in src/random/source/mod.rs, and
# the two have to agree.
[target.'cfg(not(target_os = "none"))'.dependencies]
getrandom = { version = "0.4.3", default-features = false }

# Wasm with no host interface of its own reaches the surrounding
# JavaScript, which is where that target runs. The feature is asked
# for here rather than in the entry above so that no other target sees
# it: `wasm-bindgen` and `js-sys` are gated to OS-less wasm inside
# `getrandom` too, so nothing else gains a dependency.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = [
    "wasm_js",
] }
